[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heartbeat-classification"
version = "0.2.0"
description = "PTB-XL 12-lead ECG inspection, preprocessing and augmentation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=2.1,<3", "pandas>=2.2,<4", "streamlit>=1.50,<2"]

[project.optional-dependencies]
data = ["scipy>=1.14,<2"]
verify = ["wfdb>=4.1,<5", "torch>=2.0"]
export = ["torch>=2.0"]

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
