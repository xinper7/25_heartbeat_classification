# PTB-XL v1.0.3 report-text curation. Run from the project root.
# Outputs are research artifacts, not clinical diagnoses or new labels.
project_name: ptbxl-report-curation
dataset_path: null
dataset:
  configs:
    - type: local
      path: ./data/interim/experiment1/ptbxl_reports_raw.jsonl
job_id: ptbxl_text_20261010_v4
work_dir: ./data/processed/experiment1/dj_runs/{job_id}
export_path: '{work_dir}/ptbxl_reports_clean.jsonl'
np: 1
auto_op_parallelism: false
skip_op_error: false
process:
  - clean_email_mapper: {}
  - remove_specific_chars_mapper:
      chars_to_remove: "\u00A9"
  - punctuation_normalization_mapper: {}
  - whitespace_normalization_mapper: {}
  - text_length_filter:
      min_len: 1
      max_len: 10000
